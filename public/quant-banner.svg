<svg viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bg-glow" cx="65%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#090A0F" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#050608" stop-opacity="1" />
    </radialGradient>

    <!-- Channel Fill Gradients -->
    <linearGradient id="envelope-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="breakout-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="1" />
    </linearGradient>

    <!-- Glow Filter for Signal Points -->
    <filter id="emerald-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Technical Background -->
  <rect width="800" height="240" fill="url(#bg-glow)" />
  <rect x="0.5" y="0.5" width="799" height="239" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Ultra-fine Coordinate Grid -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
  </g>

  <!-- Technical Crosshairs / Align Marks -->
  <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="1">
    <path d="M 97,40 H 103 M 100,37 V 43" />
    <path d="M 297,120 H 303 M 300,117 V 123" />
    <path d="M 497,80 H 503 M 500,77 V 83" />
    <path d="M 697,40 H 703 M 700,37 V 43" />
    <path d="M 697,160 H 703 M 700,157 V 163" />
  </g>

  <!-- Volatility Channel Ribbon (Donchian / Bollinger Compression & Expansion) -->
  <path d="
    M 60,115
    C 140,112 180,125 240,120
    C 300,115 340,126 400,110
    C 460,94  520,70  580,50
    C 640,32  700,24  760,20
    L 760,188
    C 700,185 640,182 580,172
    C 520,162 460,154 400,150
    C 340,146 300,140 240,142
    C 180,144 140,136 60,135
    Z
  " fill="url(#envelope-fill)" />

  <!-- Upper Channel Boundary -->
  <path d="
    M 60,115
    C 140,112 180,125 240,120
    C 300,115 340,126 400,110
    C 460,94  520,70  580,50
    C 640,32  700,24  760,20
  " stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.65" />

  <!-- Lower Channel Boundary -->
  <path d="
    M 60,135
    C 140,136 180,144 240,142
    C 300,140 340,146 400,150
    C 460,154 520,162 580,172
    C 640,182 700,185 760,188
  " stroke="#52525B" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.45" />

  <!-- Midpoint Equilibrium Axis -->
  <path d="
    M 60,125
    C 140,124 180,134 240,131
    C 300,128 340,136 400,130
    C 460,124 520,116 580,111
    C 640,107 700,104 760,104
  " stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="2 4" stroke-width="1" />

  <!-- Minimalist Micro-candlesticks Series Across Compression & Expansion -->
  <g>
    <!-- Phase 1: Range Oscillation -->
    <line x1="90" y1="116" x2="90" y2="134" stroke="#52525B" stroke-width="1.2" />
    <rect x="87" y="120" width="6" height="10" rx="1" fill="#27272A" stroke="#52525B" stroke-width="0.8" />

    <line x1="125" y1="112" x2="125" y2="130" stroke="#10B981" stroke-width="1.2" opacity="0.7" />
    <rect x="122" y="116" width="6" height="9" rx="1" fill="#10B981" opacity="0.8" />

    <line x1="160" y1="118" x2="160" y2="138" stroke="#52525B" stroke-width="1.2" />
    <rect x="157" y="123" width="6" height="11" rx="1" fill="#27272A" stroke="#52525B" stroke-width="0.8" />

    <line x1="195" y1="120" x2="195" y2="140" stroke="#10B981" stroke-width="1.2" opacity="0.7" />
    <rect x="192" y="124" width="6" height="10" rx="1" fill="#10B981" opacity="0.8" />

    <line x1="230" y1="116" x2="230" y2="136" stroke="#52525B" stroke-width="1.2" />
    <rect x="227" y="121" width="6" height="10" rx="1" fill="#27272A" stroke="#52525B" stroke-width="0.8" />

    <!-- Phase 2: Volatility Compression (Tight Squeeze) -->
    <line x1="270" y1="122" x2="270" y2="135" stroke="#10B981" stroke-width="1.2" opacity="0.7" />
    <rect x="267" y="125" width="6" height="7" rx="1" fill="#10B981" opacity="0.8" />

    <line x1="305" y1="121" x2="305" y2="134" stroke="#52525B" stroke-width="1.2" />
    <rect x="302" y="124" width="6" height="6" rx="1" fill="#27272A" stroke="#52525B" stroke-width="0.8" />

    <line x1="340" y1="123" x2="340" y2="134" stroke="#10B981" stroke-width="1.2" opacity="0.7" />
    <rect x="337" y="125" width="6" height="6" rx="1" fill="#10B981" opacity="0.8" />

    <line x1="375" y1="116" x2="375" y2="130" stroke="#10B981" stroke-width="1.2" />
    <rect x="372" y="119" width="6" height="8" rx="1" fill="#10B981" />

    <!-- Phase 3: The Donchian Breakout Surge -->
    <line x1="415" y1="94" x2="415" y2="124" stroke="#10B981" stroke-width="1.4" />
    <rect x="411" y="99" width="8" height="20" rx="1" fill="#10B981" filter="url(#soft-glow)" />

    <line x1="455" y1="80" x2="455" y2="114" stroke="#10B981" stroke-width="1.4" />
    <rect x="451" y="85" width="8" height="22" rx="1" fill="#10B981" />

    <line x1="495" y1="68" x2="495" y2="102" stroke="#10B981" stroke-width="1.4" />
    <rect x="491" y="73" width="8" height="22" rx="1" fill="#10B981" filter="url(#soft-glow)" />

    <line x1="535" y1="56" x2="535" y2="90" stroke="#10B981" stroke-width="1.4" />
    <rect x="531" y="60" width="8" height="24" rx="1" fill="#10B981" />

    <line x1="575" y1="44" x2="575" y2="80" stroke="#10B981" stroke-width="1.4" />
    <rect x="571" y="48" width="8" height="26" rx="1" fill="#10B981" filter="url(#soft-glow)" />

    <line x1="615" y1="36" x2="615" y2="70" stroke="#10B981" stroke-width="1.4" />
    <rect x="611" y="40" width="8" height="24" rx="1" fill="#10B981" />

    <line x1="655" y1="28" x2="655" y2="62" stroke="#10B981" stroke-width="1.4" />
    <rect x="651" y="32" width="8" height="24" rx="1" fill="#10B981" filter="url(#soft-glow)" />

    <line x1="695" y1="22" x2="695" y2="54" stroke="#10B981" stroke-width="1.4" />
    <rect x="691" y="25" width="8" height="22" rx="1" fill="#10B981" filter="url(#soft-glow)" />

    <line x1="735" y1="16" x2="735" y2="46" stroke="#10B981" stroke-width="1.4" />
    <rect x="731" y="19" width="8" height="20" rx="1" fill="#10B981" filter="url(#emerald-glow)" />
  </g>

  <!-- Continuous Dynamic Spline Track (Trendline Curve) -->
  <path d="
    M 60,128
    C 120,126 160,128 200,129
    C 240,130 280,128 320,127
    C 360,125 390,118 420,105
    C 455,90  490,78  530,66
    C 570,54  610,44  655,36
    C 690,30  720,24  755,20
  " fill="none" stroke="url(#breakout-glow)" stroke-width="2.5" filter="url(#soft-glow)" />

  <!-- Signal Nodes & Terminal Beacon (Zero Text) -->
  <!-- Breakout Inception Point -->
  <circle cx="415" cy="105" r="4" fill="#090A0F" stroke="#10B981" stroke-width="2" />
  
  <!-- Impulse Nodes -->
  <circle cx="535" cy="66" r="3" fill="#10B981" />
  <circle cx="655" cy="36" r="3" fill="#10B981" />

  <!-- Terminal Live Edge Node -->
  <circle cx="755" cy="20" r="12" fill="#10B981" fill-opacity="0.15" />
  <circle cx="755" cy="20" r="6" fill="#10B981" fill-opacity="0.4" filter="url(#soft-glow)" />
  <circle cx="755" cy="20" r="3" fill="#A7F3D0" />
</svg>