<svg viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nh-primary-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Deep dark obsidian background matching Neverhalt theme -->
  <rect width="800" height="240" fill="#08090C" />
  
  <!-- Subtle inner perimeter border -->
  <rect x="1" y="1" width="798" height="238" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Monogram Box -->
  <g transform="translate(68, 68) scale(2.17)">
    <rect x="2" y="2" width="44" height="44" rx="10" fill="#0D0F14" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" />
    <path d="M 14 34 V 14 L 24 28 V 14" stroke="url(#nh-primary-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 24 24 H 34 M 34 14 V 34" stroke="url(#nh-primary-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="34" cy="34" r="2.2" fill="#10B981" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(205, 108)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="1">NEVERHALT</text>
    <text y="32" font-family="'Geist Mono', monospace, Consolas" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.45)" letter-spacing="3.5">AUTONOMOUS AGENT CLOUD RUNTIME</text>
  </g>

  <!-- Live Pulse Pill -->
  <g transform="translate(605, 108)">
    <rect x="0" y="-18" width="135" height="30" rx="15" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.28)" stroke-width="1" />
    <circle cx="18" cy="-3" r="3.5" fill="#10B981" />
    <text x="32" y="1" font-family="'Geist Mono', monospace, Consolas" font-size="10.5" font-weight="600" fill="#10B981" letter-spacing="1.2">DAEMON 24/7</text>
  </g>
</svg>
